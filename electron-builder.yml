appId: com.updater.app
productName: UpdAter
extraMetadata:
  main: out/main/index.js
directories:
  output: release
files:
  - out/**
  - package.json
  - node_modules/7zip-bin-full/**
asar: true
win:
  target:
    - nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

